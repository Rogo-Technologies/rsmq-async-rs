name: Run tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least privilege: the job only needs to check out code and run the test suite. The
# default `GITHUB_TOKEN` scope is broader, so pin it down explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # actions/checkout@v1 is built on a Node runtime that GitHub has retired; it no
    # longer receives security fixes. actions-rs/toolchain and actions-rs/cargo are
    # likewise unmaintained (the actions-rs org is archived), so both are replaced
    # with the first-party actions below.
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Install Redis server
      run: sudo apt install redis-server

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        profile: minimal
        components: rustfmt, clippy

    - name: Cargo Build
      run: cargo build

    - name: Cargo Fmt Check
      run: cargo fmt --all -- --check

    - name: Cargo Test
      run: cargo test
